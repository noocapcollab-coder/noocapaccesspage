<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>NOOCAP · Video brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12;
    --panel:#111823;
    --panel-2:#0e141d;
    --line:#1e2836;
    --line-soft:#18202b;
    --text:#e7edf5;
    --muted:#8492a4;
    --dim:#5c6878;
    --steel:#6aa9d8;
    --personal:#d9a04a;
    --sponsor:#d96a9a;
    --ok:#5fb37e;
    --warn:#d9834a;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:0 0 64px;
  }
  a{color:var(--steel)}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}

  /* ---- top bar ---- */
  .topbar{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0d131c,#0a0d12);
    position:sticky;top:0;z-index:5;
  }
  .topbar .wrap{display:flex;align-items:center;gap:12px;height:52px}
  .mark{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;
    font-size:15px;color:var(--text);text-transform:uppercase;
  }
  .mark span{color:var(--dim)}
  .freshness{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

  /* ---- header ---- */
  .head{padding:30px 0 22px}
  .eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .tag{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;font-size:12px;
    padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
  }
  .tag.creator{color:var(--text);border-color:#2b3a4d;background:#141d29}
  .tag.personal{color:var(--personal);border-color:#453413;background:#1e1809}
  .tag.sponsor{color:var(--sponsor);border-color:#48212f;background:#1f0f16}
  h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:clamp(30px,7vw,46px);line-height:1.04;
    letter-spacing:.005em;text-transform:uppercase;margin:0;
  }

  /* ---- stage rail (signature) ---- */
  .rail{
    display:flex;gap:2px;margin:26px 0 6px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2);
  }
  .step{
    flex:1;min-width:0;padding:9px 6px 8px;text-align:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.07em;font-size:11px;
    color:var(--dim);background:transparent;border-right:1px solid var(--line-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .step:last-child{border-right:0}
  .step.past{color:var(--muted)}
  .step.now{color:#0b1017;background:var(--steel);font-weight:700}
  .rail-note{color:var(--dim);font-size:12.5px;margin:0 0 4px}

  /* ---- sections ---- */
  section{margin-top:30px}
  .label{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--dim);
    margin:0 0 12px;
  }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .card p{margin:0 0 12px;white-space:pre-wrap}
  .card p:last-child{margin-bottom:0}
  .card h4{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:16px;margin:18px 0 8px}
  .card h4:first-child{margin-top:0}
  .card ul{margin:0 0 12px;padding-left:20px}
  .card blockquote{margin:0 0 12px;padding-left:14px;border-left:2px solid var(--line);color:var(--muted)}
  .card img{max-width:100%;border-radius:8px;display:block;margin:0 0 12px}
  .card hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .card pre{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:13px;margin:0 0 12px}

  /* ---- asset links ---- */
  .links{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .link{
    display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;text-decoration:none;color:var(--text);
    transition:border-color .15s ease,transform .15s ease;
  }
  .link:hover{border-color:#33465c;transform:translateY(-1px)}
  .link:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  .link .glyph{font-size:17px;line-height:1}
  .link .name{font-weight:600;font-size:14.5px}
  .link .host{color:var(--dim);font-size:12px;display:block;font-weight:400}

  /* ---- meta grid ---- */
  .meta{display:grid;gap:1px;grid-template-columns:1fr 1fr;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .cell{background:var(--panel);padding:13px 16px}
  .cell dt{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.11em;margin:0 0 3px;font-family:'Barlow Condensed',sans-serif;font-weight:600}
  .cell dd{margin:0;font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums}
  .cell dd.empty{color:var(--dim);font-weight:400}

  /* ---- states ---- */
  .state{padding:60px 0;text-align:center}
  .state h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:26px;margin:0 0 8px}
  .state p{color:var(--muted);margin:0 auto;max-width:520px;word-break:break-word}
  .skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,#141c27,#1b2532,#141c27);background-size:200% 100%;animation:sh 1.4s ease infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .foot{margin-top:34px;color:var(--dim);font-size:12.5px;border-top:1px solid var(--line-soft);padding-top:14px}

  @media (max-width:560px){
    .links{grid-template-columns:1fr}
    .meta{grid-template-columns:1fr}
    .rail{flex-wrap:wrap}
    .step{flex:1 0 33.333%;border-bottom:1px solid var(--line-soft)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <div class="mark">NOOCAP <span>/ VIDEO BRIEF</span></div>
  <div class="freshness" id="fresh"></div>
</div></div>

<main class="wrap" id="root">
  <div class="head">
    <div class="skeleton" style="width:130px;margin-bottom:14px"></div>
    <div class="skeleton" style="height:34px;width:75%"></div>
  </div>
</main>

<script>
(function(){
  var STAGES = [
    { name:'Script',   match:['1-','2-','3-','4-','5-'] },
    { name:'Film',     match:['6-'] },
    { name:'Edit',     match:['7-'] },
    { name:'Changes',  match:['8-'] },
    { name:'Approval', match:['9-'] },
    { name:'To post',  match:['10-','11-'] },
    { name:'Posted',   match:['12-','13-'] }
  ];

  function stageIndex(status){
    var s = (status||'').trim();
    for (var i=0;i<STAGES.length;i++){
      for (var j=0;j<STAGES[i].match.length;j++){
        if (s.indexOf(STAGES[i].match[j]) === 0) return i;
      }
    }
    return -1;
  }

  function esc(v){
    return String(v==null?'':v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function host(url){
    try { return new URL(url).hostname.replace(/^www\./,''); }
    catch(e){ return 'link'; }
  }

  function firstUrl(v){
    if (!v) return '';
    var m = String(v).match(/https?:\/\/[^\s,]+/);
    return m ? m[0] : '';
  }

  function niceDate(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined,{ weekday:'short', day:'numeric', month:'short' });
  }

  function bodyHtml(blocks){
    if (!blocks || !blocks.length) return '';
    var out = '', openList = false;
    function closeList(){ if (openList){ out += '</ul>'; openList = false; } }
    blocks.forEach(function(b){
      if (b.kind === 'li'){
        if (!openList){ out += '<ul>'; openList = true; }
        out += '<li>' + esc(b.text) + '</li>';
        return;
      }
      closeList();
      if (b.kind === 'p') out += '<p>' + esc(b.text) + '</p>';
      else if (b.kind === 'h') out += '<h4>' + esc(b.text) + '</h4>';
      else if (b.kind === 'todo') out += '<p>' + (b.done ? '☑' : '☐') + ' ' + esc(b.text) + '</p>';
      else if (b.kind === 'quote') out += '<blockquote>' + esc(b.text) + '</blockquote>';
      else if (b.kind === 'code') out += '<pre>' + esc(b.text) + '</pre>';
      else if (b.kind === 'hr') out += '<hr>';
      else if (b.kind === 'img') out += '<img src="' + esc(b.text) + '" alt="">';
      else if (b.kind === 'file') out += '<p><a href="' + esc(b.text) + '" target="_blank" rel="noopener">' + esc(host(b.text)) + '</a></p>';
    });
    closeList();
    return out;
  }

  function linkRow(name, glyph, value){
    var url = firstUrl(value);
    if (!url) return '';
    return '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener">' +
           '<span class="glyph">' + glyph + '</span>' +
           '<span><span class="name">' + name + '</span>' +
           '<span class="host">' + esc(host(url)) + '</span></span></a>';
  }

  function render(v){
    var idx = stageIndex(v.status);
    var isSponsor = /sponsor/i.test(v.type || '');
    var typeClass = isSponsor ? 'sponsor' : (v.type ? 'personal' : '');

    var rail = STAGES.map(function(s, i){
      var cls = i === idx ? 'now' : (idx > -1 && i < idx ? 'past' : '');
      return '<div class="step ' + cls + '">' + s.name + '</div>';
    }).join('');

    var links = linkRow('Raw footage','🎞️',v.rawFootage) +
                linkRow('Reference video','🔗',v.refVideo) +
                linkRow('Assets','📁',v.asset) +
                linkRow('Edited video','✅',v.editedVideo);

    var briefBody = bodyHtml(v.body);
    var briefText = v.brief ? '<p>' + esc(v.brief) + '</p>' : '';
    var brief = briefText + briefBody;

    var html = '';

    html += '<div class="head">';
    html += '<div class="eyebrow">';
    if (v.creator) html += '<span class="tag creator">' + esc(v.creator) + '</span>';
    if (v.type)    html += '<span class="tag ' + typeClass + '">' + esc(v.type) + '</span>';
    if (v.status)  html += '<span class="tag">' + esc(v.status) + '</span>';
    html += '</div>';
    html += '<h1>' + esc(v.title) + '</h1>';
    html += '<div class="rail">' + rail + '</div>';
    html += '<p class="rail-note">' + (v.editor ? esc(v.editor) + ' is on this one.' : 'No editor assigned yet.') +
            (v.postDate ? ' Goes out ' + esc(niceDate(v.postDate)) + '.' : '') + '</p>';
    html += '</div>';

    if (links){
      html += '<section><h2 class="label">Files</h2><div class="links">' + links + '</div></section>';
    }

    if (brief){
      html += '<section><h2 class="label">Brief</h2><div class="card">' + brief + '</div></section>';
    }

    if (v.caption){
      html += '<section><h2 class="label">Caption</h2><div class="card"><p>' + esc(v.caption) + '</p></div></section>';
    }

    if (v.notes){
      html += '<section><h2 class="label">Notes</h2><div class="card"><p>' + esc(v.notes) + '</p></div></section>';
    }

    html += '<p class="foot">Read-only view of the production card. Anything that needs changing goes through your channel in Discord.</p>';

    document.getElementById('root').innerHTML = html;
    document.title = v.title + ' · NOOCAP';
  }

  function state(title, message){
    document.getElementById('root').innerHTML =
      '<div class="state"><h2>' + title + '</h2><p>' + message + '</p></div>';
  }
  window.addEventListener('online', function(){ load(); });

  function stamp(){
    var el = document.getElementById('fresh');
    var d = new Date();
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    el.textContent = 'Updated ' + hh + ':' + mm;
  }

  var id = new URLSearchParams(location.search).get('id');

  function load(){
    if (!id){
      state('No video in this link', 'The link needs a video ID on the end. Ask in your Discord channel for a fresh one.');
      return;
    }
    fetch('/api/video?id=' + encodeURIComponent(id))
      .then(function(r){
        return r.text().then(function(t){ return { ok:r.ok, status:r.status, text:t }; });
      })
      .then(function(res){
        var data = null;
        try { data = JSON.parse(res.text); } catch (e) { data = null; }

        if (data === null){
          state('The data endpoint is not responding',
                'The page loaded but /api/video returned HTTP ' + res.status +
                ' with this instead of data: <br><br><code style="color:#8492a4;font-size:12.5px">' +
                esc(res.text.slice(0,160)) + '</code>');
          return;
        }
        if (res.status === 404 || data.error === 'not_found'){
          state('Video not found', 'This card may have been deleted or moved to another board. Ask in your Discord channel for a fresh link.');
          return;
        }
        if (!res.ok){
          state('Cannot load this video',
                (data.error === 'notion_error' ? 'Notion rejected the request. Usually the NOTION_TOKEN belongs to a different integration than the one connected to the boards.' :
                 data.error === 'bad_id' ? 'The video ID on this link is not a valid Notion page ID.' :
                 'Something broke on the way to Notion.') +
                '<br><br><code style="color:#8492a4;font-size:12.5px">' + esc(String(data.message || data.error || '')).slice(0,200) + '</code>');
          return;
        }
        render(data);
        stamp();
      })
      .catch(function(err){
        if (!navigator.onLine){
          state('You are offline', 'Reconnect and this page will load the brief.');
        } else {
          state('Could not reach the server', esc(String(err && err.message ? err.message : err)));
        }
      });
  }

  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) load();
  });
})();
</script>
</body>
</html>
