<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>NOOCAP · Video brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12;
    --panel:#111823;
    --panel-2:#0e141d;
    --line:#1e2836;
    --line-soft:#18202b;
    --text:#e7edf5;
    --muted:#8492a4;
    --dim:#5c6878;
    --steel:#6aa9d8;
    --personal:#d9a04a;
    --sponsor:#d96a9a;
    --ok:#5fb37e;
    --warn:#d9834a;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:0 0 64px;
  }
  a{color:var(--steel)}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}

  /* ---- top bar ---- */
  .topbar{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0d131c,#0a0d12);
    position:sticky;top:0;z-index:5;
  }
  .topbar .wrap{display:flex;align-items:center;gap:12px;height:52px}
  .mark{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;
    font-size:15px;color:var(--text);text-transform:uppercase;
  }
  .mark span{color:var(--dim)}
  .freshness{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

  /* ---- header ---- */
  .head{padding:30px 0 22px}
  .eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .tag{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;font-size:12px;
    padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
  }
  .tag.creator{color:var(--text);border-color:#2b3a4d;background:#141d29}
  .tag.personal{color:var(--personal);border-color:#453413;background:#1e1809}
  .tag.sponsor{color:var(--sponsor);border-color:#48212f;background:#1f0f16}
  h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:clamp(30px,7vw,46px);line-height:1.04;
    letter-spacing:.005em;text-transform:uppercase;margin:0;
  }

  /* ---- stage rail (signature) ---- */
  .rail{
    display:flex;gap:2px;margin:26px 0 6px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2);
  }
  .step{
    flex:1;min-width:0;padding:9px 6px 8px;text-align:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.07em;font-size:11px;
    color:var(--dim);background:transparent;border-right:1px solid var(--line-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .step:last-child{border-right:0}
  .step.past{color:var(--muted)}
  .step.now{color:#0b1017;background:var(--steel);font-weight:700}
  .rail-note{color:var(--dim);font-size:12.5px;margin:0 0 4px}

  /* ---- sections ---- */
  section{margin-top:30px}
  .label{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--dim);
    margin:0 0 12px;
  }
  .label .count{color:var(--muted);letter-spacing:.08em}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .card p{margin:0 0 12px;white-space:pre-wrap}
  .card p:last-child{margin-bottom:0}
  .card h4{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:16px;margin:18px 0 8px}
  .card h4:first-child{margin-top:0}
  .card ul{margin:0 0 12px;padding-left:20px}
  .card blockquote{margin:0 0 12px;padding-left:14px;border-left:2px solid var(--line);color:var(--muted)}
  .card img{max-width:100%;border-radius:8px;display:block;margin:0 0 12px}
  .card hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .card pre{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:13px;margin:0 0 12px}

  /* ---- asset links ---- */
  .links{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .link{
    display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;text-decoration:none;color:var(--text);
    transition:border-color .15s ease,transform .15s ease;
  }
  .link:hover{border-color:#33465c;transform:translateY(-1px)}
  .link:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  .link .glyph{font-size:17px;line-height:1}
  .link .name{font-weight:600;font-size:14.5px}
  .link .host{color:var(--dim);font-size:12px;display:block;font-weight:400}

  /* ---- comments ---- */
  .thread{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin:0 0 10px;
  }
  .thread:last-child{margin-bottom:0}
  .cmt + .cmt{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .cmt.reply{margin-left:12px;padding-left:14px;border-top:0;border-left:2px solid var(--line)}
  .cmt-head{display:flex;align-items:baseline;gap:9px;margin-bottom:5px;flex-wrap:wrap}
  .cmt-who{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;color:var(--muted);
  }
  .cmt-when{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
  .cmt-body{white-space:pre-wrap;font-size:14.5px}
  .cmt-body a{word-break:break-word}
  .cmt-body code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px}
  .cmt-body mark{background:#2a1c1c;color:#e8bfbf;padding:1px 4px;border-radius:4px}
  .cmt-note{color:var(--dim);font-size:13px;margin:0}
  #comments.pinned{margin-top:24px}
  #comments.pinned .thread{border-color:#3a2a1c;background:linear-gradient(180deg,#161b25,#111823)}
  #comments.pinned .label{color:var(--personal)}

  /* ---- edit tracking ---- */
  .track{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .track-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:14px}
  .track-status b{color:var(--text);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.run{background:var(--steel)}
  .dot.review{background:var(--personal)}
  .dot.sent{background:var(--ok)}
  .dot.redo{background:var(--sponsor)}
  .track-btns{display:flex;gap:10px;flex-wrap:wrap}
  .tbtn{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:14px;
    padding:11px 18px;border-radius:10px;border:1px solid #2b3a4d;background:#141d29;color:var(--text);cursor:pointer;
    transition:border-color .15s ease,background .15s ease;
  }
  .tbtn:hover{border-color:var(--steel)}
  .tbtn:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  .tbtn.primary{background:var(--steel);border-color:var(--steel);color:#0b1017}
  .tbtn[disabled]{opacity:.5;cursor:wait}
  .track-times{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 0;color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
  .track-err{color:var(--warn);font-size:13px;margin:10px 0 0}
  .handoff{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin:4px 0 14px}
  .handoff label{display:flex;flex-direction:column;gap:5px;font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--dim)}
  .handoff label.wide{grid-column:1 / -1}
  .handoff input,.handoff select{
    font:inherit;font-size:14.5px;color:var(--text);background:var(--panel-2);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;text-transform:none;letter-spacing:0;font-family:'Inter',sans-serif;
  }
  .handoff input:focus,.handoff select:focus{outline:2px solid var(--steel);outline-offset:1px;border-color:var(--steel)}
  .handoff-note{color:var(--dim);font-size:12.5px;margin:0 0 12px}
  @media (max-width:560px){ .handoff{grid-template-columns:1fr} }

  /* ---- meta grid ---- */
  .meta{display:grid;gap:1px;grid-template-columns:1fr 1fr;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .cell{background:var(--panel);padding:13px 16px}
  .cell dt{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.11em;margin:0 0 3px;font-family:'Barlow Condensed',sans-serif;font-weight:600}
  .cell dd{margin:0;font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums}
  .cell dd.empty{color:var(--dim);font-weight:400}

  /* ---- states ---- */
  .state{padding:60px 0;text-align:center}
  .state h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:26px;margin:0 0 8px}
  .state p{color:var(--muted);margin:0 auto;max-width:520px;word-break:break-word}
  .skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,#141c27,#1b2532,#141c27);background-size:200% 100%;animation:sh 1.4s ease infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .foot{margin-top:34px;color:var(--dim);font-size:12.5px;border-top:1px solid var(--line-soft);padding-top:14px}

  @media (max-width:560px){
    .links{grid-template-columns:1fr}
    .meta{grid-template-columns:1fr}
    .rail{flex-wrap:wrap}
    .step{flex:1 0 33.333%;border-bottom:1px solid var(--line-soft)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <div class="mark">NOOCAP <span>/ VIDEO BRIEF</span></div>
  <div class="freshness" id="fresh"></div>
</div></div>

<main class="wrap" id="root">
  <div class="head">
    <div class="skeleton" style="width:130px;margin-bottom:14px"></div>
    <div class="skeleton" style="height:34px;width:75%"></div>
  </div>
</main>

<script>
(function(){
  var STAGES = [
    { name:'Script',   match:['1-','2-','3-','4-','5-'] },
    { name:'Film',     match:['6-'] },
    { name:'Edit',     match:['7-'] },
    { name:'Changes',  match:['8-'] },
    { name:'Approval', match:['9-'] },
    { name:'To post',  match:['10-','11-'] },
    { name:'Posted',   match:['12-','13-'] }
  ];

  var commentsHtml = '';   // last painted comments, kept so refreshes do not flicker

  function stageIndex(status){
    var s = (status||'').trim();
    for (var i=0;i<STAGES.length;i++){
      for (var j=0;j<STAGES[i].match.length;j++){
        if (s.indexOf(STAGES[i].match[j]) === 0) return i;
      }
    }
    return -1;
  }

  function esc(v){
    return String(v==null?'':v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function host(url){
    try { return new URL(url).hostname.replace(/^www\./,''); }
    catch(e){ return 'link'; }
  }

  function firstUrl(v){
    if (!v) return '';
    var m = String(v).match(/https?:\/\/[^\s,]+/);
    return m ? m[0] : '';
  }

  function niceDate(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined,{ weekday:'short', day:'numeric', month:'short' });
  }

  function ago(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.round(mins/60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.round(hrs/24);
    if (days < 7) return days + 'd ago';
    return d.toLocaleDateString(undefined,{ day:'numeric', month:'short' });
  }

  function bodyHtml(blocks){
    if (!blocks || !blocks.length) return '';
    var out = '', openList = false;
    function closeList(){ if (openList){ out += '</ul>'; openList = false; } }
    blocks.forEach(function(b){
      if (b.kind === 'li'){
        if (!openList){ out += '<ul>'; openList = true; }
        out += '<li>' + esc(b.text) + '</li>';
        return;
      }
      closeList();
      if (b.kind === 'p') out += '<p>' + esc(b.text) + '</p>';
      else if (b.kind === 'h') out += '<h4>' + esc(b.text) + '</h4>';
      else if (b.kind === 'todo') out += '<p>' + (b.done ? '☑' : '☐') + ' ' + esc(b.text) + '</p>';
      else if (b.kind === 'quote') out += '<blockquote>' + esc(b.text) + '</blockquote>';
      else if (b.kind === 'code') out += '<pre>' + esc(b.text) + '</pre>';
      else if (b.kind === 'hr') out += '<hr>';
      else if (b.kind === 'img') out += '<img src="' + esc(b.text) + '" alt="">';
      else if (b.kind === 'file') out += '<p><a href="' + esc(b.text) + '" target="_blank" rel="noopener">' + esc(host(b.text)) + '</a></p>';
    });
    closeList();
    return out;
  }

  function richHtml(parts){
    if (!parts || !parts.length) return '';
    return parts.map(function(p){
      var t = esc(p.t);
      if (p.c)  t = '<code>' + t + '</code>';
      if (p.b)  t = '<strong>' + t + '</strong>';
      if (p.i)  t = '<em>' + t + '</em>';
      if (p.u)  t = '<u>' + t + '</u>';
      if (p.s)  t = '<s>' + t + '</s>';
      if (p.hl && /background/.test(p.hl)) t = '<mark>' + t + '</mark>';
      if (p.href) t = '<a href="' + esc(p.href) + '" target="_blank" rel="noopener">' + t + '</a>';
      return t;
    }).join('');
  }

  function linkRow(name, glyph, value){
    var url = firstUrl(value);
    if (!url) return '';
    return '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener">' +
           '<span class="glyph">' + glyph + '</span>' +
           '<span><span class="name">' + name + '</span>' +
           '<span class="host">' + esc(host(url)) + '</span></span></a>';
  }

  function render(v){
    var idx = stageIndex(v.status);
    var isSponsor = /sponsor/i.test(v.type || '');
    var typeClass = isSponsor ? 'sponsor' : (v.type ? 'personal' : '');

    var rail = STAGES.map(function(s, i){
      var cls = i === idx ? 'now' : (idx > -1 && i < idx ? 'past' : '');
      return '<div class="step ' + cls + '">' + s.name + '</div>';
    }).join('');

    var links = linkRow('Raw footage','🎞️',v.rawFootage) +
                linkRow('Reference video','🔗',v.refVideo) +
                linkRow('Assets','📁',v.asset) +
                linkRow('Edited video','✅',v.editedVideo);

    var briefBody = bodyHtml(v.body);
    var briefText = v.brief ? '<p>' + esc(v.brief) + '</p>' : '';
    var brief = briefText + briefBody;

    var html = '';

    html += '<div class="head">';
    html += '<div class="eyebrow">';
    if (v.creator) html += '<span class="tag creator">' + esc(v.creator) + '</span>';
    if (v.type)    html += '<span class="tag ' + typeClass + '">' + esc(v.type) + '</span>';
    if (v.status)  html += '<span class="tag">' + esc(v.status) + '</span>';
    html += '</div>';
    html += '<h1>' + esc(v.title) + '</h1>';
    html += '<div class="rail">' + rail + '</div>';
    html += '<p class="rail-note">' + (v.editor ? esc(v.editor) + ' is on this one.' : 'No editor assigned yet.') +
            (v.postDate ? ' Goes out ' + esc(niceDate(v.postDate)) + '.' : '') + '</p>';
    html += '</div>';

    // Edit tracking: the editor's buttons, painted by paintTrack() so refreshes keep the latest state.
    html += '<section><h2 class="label">Your edit</h2><div class="track" id="track"></div></section>';

    // Comments sit first, above the files, so a note for the editor is the first thing read.
    html += '<section id="comments" class="pinned" hidden><h2 class="label" id="commentsLabel">Comments</h2>' +
            '<div id="commentsBody"></div></section>';

    if (links){
      html += '<section><h2 class="label">Files</h2><div class="links">' + links + '</div></section>';
    }

    if (brief){
      html += '<section><h2 class="label">Brief</h2><div class="card">' + brief + '</div></section>';
    }

    if (v.caption){
      html += '<section><h2 class="label">Caption</h2><div class="card"><p>' + esc(v.caption) + '</p></div></section>';
    }

    if (v.notes){
      html += '<section><h2 class="label">Notes</h2><div class="card"><p>' + esc(v.notes) + '</p></div></section>';
    }

    html += '<p class="foot">The brief is read-only. The buttons above log your edit times and send the finished video for review. Anything else that needs changing goes through your channel in Discord.</p>';

    document.getElementById('root').innerHTML = html;
    document.title = v.title + ' · NOOCAP';

    if (commentsHtml) paintComments(commentsHtml, null);  // repaint what we already had
    loadComments();

    video = v;
    paintTrack();
    if (!trackBusy) loadTrack();
  }

  // ---------- edit tracking ----------
  var video = null, track = null, trackLoaded = false, trackBusy = false, trackErr = '';
  var handoffOpen = false, draft = null;
  var DEFAULT_CREATORS = ['Duncan','Brad','Lindsay','Chris','EmTech','Valerie','David','NICOLE'];
  var DEFAULT_EDITORS  = ['Parvez','Sumith','Utsav','Vicky','Prabal','Abhishek','PRATEEK'];

  function matchOpt(v, list){
    v = String(v || '').trim().toLowerCase();
    if (v === 'valeri') v = 'valerie';
    for (var i=0;i<list.length;i++) if (list[i].toLowerCase() === v) return list[i];
    return '';
  }

  // Prefills the hand-off from the brief so the editor normally only pastes the Frame.io link.
  function newDraft(){
    var opts = (track && track.options) || {};
    var fmt = String(video.format || '').toUpperCase();
    var typ = String(video.type || '').toUpperCase();
    return {
      frameio: '',
      creator: matchOpt(video.creator, opts.creators || DEFAULT_CREATORS),
      editor: matchOpt(video.editor || (function(){ try { return localStorage.getItem('noocap_editor'); } catch(e){ return ''; } })(), opts.editors || DEFAULT_EDITORS),
      contentType: /LONG/.test(fmt) ? 'LONG-FORM' : (/SHORT/.test(fmt) ? 'SHORT-FORM' : ''),
      type: /SPONSOR/.test(typ) ? 'SPONSOR' : (/PERSONAL/.test(typ) ? 'PERSONAL' : '')
    };
  }

  function selectHtml(field, label, list, value){
    var o = '<option value="">Choose…</option>' + list.map(function(x){
      return '<option' + (x === value ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join('');
    return '<label>' + label + '<select data-f="' + field + '">' + o + '</select></label>';
  }

  function handoffHtml(){
    var opts = (track && track.options) || {};
    return '<p class="handoff-note">This sends it to the team for review, same as the handoff form. Check the details and paste the Frame.io link.</p>' +
      '<div class="handoff">' +
        '<label class="wide">Frame.io link<input data-f="frameio" type="url" inputmode="url" placeholder="https://f.io/…" value="' + esc(draft.frameio) + '"></label>' +
        selectHtml('creator','Creator', opts.creators || DEFAULT_CREATORS, draft.creator) +
        selectHtml('editor','Your name', opts.editors || DEFAULT_EDITORS, draft.editor) +
        selectHtml('contentType','Format', ['SHORT-FORM','LONG-FORM'], draft.contentType) +
        selectHtml('type','Type', ['PERSONAL','SPONSOR'], draft.type) +
      '</div>';
  }

  function hhmm(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function mins(a, b){
    if (!a || !b) return '';
    var m = Math.round((new Date(b) - new Date(a)) / 60000);
    if (isNaN(m) || m < 0) return '';
    return m < 60 ? m + ' min' : Math.floor(m/60) + 'h ' + (m%60) + 'm';
  }

  function btn(action, label, primary){
    return '<button class="tbtn' + (primary ? ' primary' : '') + '" data-act="' + action + '"' +
           (trackBusy ? ' disabled' : '') + '>' + label + '</button>';
  }

  function paintTrack(){
    var el = document.getElementById('track');
    if (!el) return;
    if (!trackLoaded){ el.innerHTML = '<div class="skeleton" style="width:60%"></div>'; return; }

    var t = track || { tracked:false };
    var stage = t.stage || '';
    var dot = '', line = '', btns = '';

    if (!t.tracked){
      line = 'Not started yet. Press the button the moment you paste the prompt into Claude.';
      btns = btn('start_claude','Started in Claude',true) + btn('start_manual','Start manual edit',false);
    } else if (stage === 'Revision'){
      dot = 'redo'; line = '<b>Changes requested.</b> Start again when you begin the revision.';
      btns = btn('start_claude','Started revision in Claude',true) + btn('start_manual','Start manual revision',false);
    } else if (stage === 'Claude running'){
      dot = 'run'; line = '<b>Claude is editing</b> since ' + hhmm(t.startedAt) + '. Press when the render is done.';
      btns = btn('claude_done','Claude render done',true);
    } else if (stage === 'Editor review' || stage === 'Manual editing'){
      dot = 'review'; line = '<b>' + (stage === 'Manual editing' ? 'Manual edit in progress.' : 'You are reviewing and fixing.') + '</b> Press when it is final and uploaded to Frame.io.';
      if (handoffOpen){
        line = '<b>Send for review</b>';
        btns = btn('send_review_confirm','Send for review',true) + btn('handoff_cancel','Cancel',false);
      } else {
        btns = btn('send_review', t.intakeId ? 'Sent revision for review' : 'Send for review', true);
      }
    } else if (stage === 'Ready for Harsh'){
      dot = 'sent'; line = '<b>Sent for review</b> at ' + hhmm(t.sentAt) + '. Nothing else to do unless changes come back.';
    } else if (stage === 'Delivered'){
      dot = 'sent'; line = '<b>Delivered.</b> Nice work.';
    } else {
      line = 'Stage: ' + esc(stage);
    }

    var times = '';
    if (t.startedAt) times += '<span>Started ' + hhmm(t.startedAt) + '</span>';
    if (t.claudeDoneAt) times += '<span>Claude took ' + mins(t.startedAt, t.claudeDoneAt) + '</span>';
    if (t.sentAt) times += '<span>Total ' + mins(t.startedAt, t.sentAt) + '</span>';
    if (t.revisions) times += '<span>Revisions ' + t.revisions + '</span>';

    var form = (handoffOpen && (stage === 'Editor review' || stage === 'Manual editing')) ? handoffHtml() : '';

    el.innerHTML =
      '<p class="track-status">' + (dot ? '<span class="dot ' + dot + '"></span>' : '<span class="dot"></span>') + '<span>' + line + '</span></p>' + form +
      (btns ? '<div class="track-btns">' + btns + '</div>' : '') +
      (times ? '<div class="track-times">' + times + '</div>' : '') +
      (trackErr ? '<p class="track-err">' + esc(trackErr) + '</p>' : '');
  }

  function loadTrack(){
    if (!id) return;
    fetch('/api/track?id=' + encodeURIComponent(id))
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, data:j }; }); })
      .then(function(res){
        trackLoaded = true;
        if (res.ok){ track = res.data; trackErr = ''; }
        else trackErr = (res.data && res.data.message) || 'Tracking is unavailable right now.';
        paintTrack();
      })
      .catch(function(){ trackLoaded = true; trackErr = 'Tracking is unavailable right now.'; paintTrack(); });
  }

  function editorName(){
    if (video && video.editor) return video.editor;
    var n = '';
    try { n = localStorage.getItem('noocap_editor') || ''; } catch(e){}
    if (!n){
      n = (window.prompt('Your name, so this edit is logged to you:') || '').trim();
      try { if (n) localStorage.setItem('noocap_editor', n); } catch(e){}
    }
    return n;
  }

  function sendTrack(action){
    if (trackBusy || !video) return;
    if (action === 'handoff_cancel'){ handoffOpen = false; trackErr = ''; paintTrack(); return; }
    // First hand-off opens the details panel; a revision round reuses the existing review ticket and sends straight away.
    if (action === 'send_review' && !(track && track.intakeId)){
      handoffOpen = true; draft = draft || newDraft(); trackErr = ''; paintTrack();
      var f = document.querySelector('[data-f="frameio"]'); if (f) f.focus();
      return;
    }
    var payload = { id:id, action:action, title:video.title, creator:video.creator };
    if (action === 'send_review_confirm'){
      if (!/^https?:\/\/\S+$/i.test(draft.frameio)){ trackErr = 'Paste the Frame.io link first.'; paintTrack(); return; }
      payload.action = 'send_review';
      payload.handoff = draft;
      payload.editor = draft.editor || editorName();
      try { if (draft.editor) localStorage.setItem('noocap_editor', draft.editor); } catch(e){}
    } else {
      payload.editor = editorName();
    }
    trackBusy = true; trackErr = ''; paintTrack();
    fetch('/api/track', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, data:j }; }); })
      .then(function(res){
        trackBusy = false;
        if (res.ok){ track = res.data; if (payload.action === 'send_review'){ handoffOpen = false; draft = null; } }
        else trackErr = (res.data && res.data.message) || 'That did not save. Try again.';
        paintTrack();
      })
      .catch(function(){ trackBusy = false; trackErr = 'That did not save. Check your connection and try again.'; paintTrack(); });
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[data-act]');
    if (b) sendTrack(b.getAttribute('data-act'));
  });
  function keepDraft(e){
    var f = e.target && e.target.getAttribute && e.target.getAttribute('data-f');
    if (f && draft) draft[f] = e.target.value;
    if (f && trackErr){ trackErr = ''; var er = document.querySelector('.track-err'); if (er) er.remove(); }
  }
  document.addEventListener('input', keepDraft);
  document.addEventListener('change', keepDraft);

  function paintComments(inner, label){
    var sec  = document.getElementById('comments');
    var body = document.getElementById('commentsBody');
    if (!sec || !body) return;
    body.innerHTML = inner;
    if (label) document.getElementById('commentsLabel').innerHTML = label;
    sec.hidden = !inner;
  }

  function loadComments(){
    if (!id) return;
    fetch('/api/comments?id=' + encodeURIComponent(id))
      .then(function(r){ return r.json().then(function(j){ return { status:r.status, data:j }; }); })
      .then(function(res){
        var d = res.data || {};

        if (res.status !== 200 || !d.threads || !d.threads.length){
          commentsHtml = '';
          paintComments('', 'Comments');
          return;
        }

        var out = d.threads.map(function(th){
          var inner = th.comments.map(function(c, i){
            return '<div class="cmt' + (i ? ' reply' : '') + '">' +
                     '<div class="cmt-head">' +
                       '<span class="cmt-who">' + esc(c.author) + '</span>' +
                       '<span class="cmt-when">' + esc(ago(c.createdTime)) + '</span>' +
                     '</div>' +
                     '<div class="cmt-body">' + richHtml(c.rich) + '</div>' +
                   '</div>';
          }).join('');
          return '<div class="thread">' + inner + '</div>';
        }).join('');

        commentsHtml = out;
        paintComments(out, 'Comments <span class="count">· ' + d.count + '</span>');
      })
      .catch(function(){
        commentsHtml = '';
        paintComments('', 'Comments');
      });
  }

  function state(title, message){
    document.getElementById('root').innerHTML =
      '<div class="state"><h2>' + title + '</h2><p>' + message + '</p></div>';
  }
  window.addEventListener('online', function(){ load(); });

  function stamp(){
    var el = document.getElementById('fresh');
    var d = new Date();
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    el.textContent = 'Updated ' + hh + ':' + mm;
  }

  var id = new URLSearchParams(location.search).get('id');

  function load(){
    if (handoffOpen && window.__vbLoaded) return;  // don't wipe the hand-off panel while the editor is filling it in
    if (!id){
      state('No video in this link', 'The link needs a video ID on the end. Ask in your Discord channel for a fresh one.');
      return;
    }
    fetch('/api/video?id=' + encodeURIComponent(id))
      .then(function(r){
        return r.text().then(function(t){ return { ok:r.ok, status:r.status, text:t }; });
      })
      .then(function(res){
        var data = null;
        try { data = JSON.parse(res.text); } catch (e) { data = null; }

        if (data === null){
          state('The data endpoint is not responding',
                'The page loaded but /api/video returned HTTP ' + res.status +
                ' with this instead of data: <br><br><code style="color:#8492a4;font-size:12.5px">' +
                esc(res.text.slice(0,160)) + '</code>');
          return;
        }
        if (res.status === 404 || data.error === 'not_found'){
          state('Video not found', 'This card may have been deleted or moved to another board. Ask in your Discord channel for a fresh link.');
          return;
        }
        if (data.error === 'busy'){
          // Notion is rate limiting: keep what's on screen if we already have it, otherwise say so and retry soon
          if (!window.__vbLoaded) state('Loading…', 'Notion is busy right now. Trying again in a few seconds.');
          setTimeout(load, 8000);
          return;
        }
        if (!res.ok){
          state('Cannot load this video',
                (data.error === 'notion_error' ? 'Notion rejected the request. Usually the NOTION_TOKEN belongs to a different integration than the one connected to the boards.' :
                 data.error === 'bad_id' ? 'The video ID on this link is not a valid Notion page ID.' :
                 'Something broke on the way to Notion.') +
                '<br><br><code style="color:#8492a4;font-size:12.5px">' + esc(String(data.message || data.error || '')).slice(0,200) + '</code>');
          return;
        }
        render(data); window.__vbLoaded = true;
        stamp();
      })
      .catch(function(err){
        if (!navigator.onLine){
          state('You are offline', 'Reconnect and this page will load the brief.');
        } else {
          state('Could not reach the server', esc(String(err && err.message ? err.message : err)));
        }
      });
  }

  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) load();
  });
})();
</script>
</body>
</html>
